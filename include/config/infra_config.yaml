# Infrastructure Configuration: Connection info, tunables.
# All connection strings and resource names live here, not in code or SQL.
#
# This repo's runnable implementation uses DuckDB as the warehouse and
# SQLite as the serving database -- both embedded, no server to run --
# so the pipeline works with nothing installed beyond requirements.txt.
# In production this pattern targets a real warehouse (BigQuery, Snowflake,
# Redshift) and a real serving database (Postgres, MySQL); see
# docs/design-pattern.md and dags/order_lookup_sample.py (the Airflow
# reference) for that framing. `type` and `production_equivalent` below
# are documentation, not switches -- pipeline/ only ever talks to DuckDB
# and SQLite.

warehouse:
  type: duckdb
  production_equivalent: bigquery  # or snowflake, redshift, etc.
  duckdb_path: warehouse.duckdb

object_storage:
  # In production, export shards go to GCS/S3 to decouple export speed
  # from import speed. Locally, "object storage" is just a folder.
  production_equivalent: gcs_or_s3
  export_dir: tmp/exports
  export_format: parquet

serving_db:
  type: sqlite
  production_equivalent: postgres
  sqlite_path: serving.db

  # Import tuning: concurrent shard imports.
  # SQLite writes are single-writer, so this pipeline imports shards
  # sequentially regardless of this value -- it's kept here because a
  # real Postgres target would honor it (see include/README.md).
  import_max_concurrency: 2

  # Indexes to build on staging table (after bulk load, not before)
  staging_indexes:
    - name: idx_order_lookup_staging_order_id
      unique: true
      columns:
        - order_id
    - name: idx_order_lookup_staging_customer_id
      unique: false
      columns:
        - customer_id

# Data quality tolerance
row_count_reconciliation_tolerance: 0.01  # 1% difference acceptable
