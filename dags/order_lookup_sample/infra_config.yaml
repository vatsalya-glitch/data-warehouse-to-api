# Infrastructure Configuration: Connection IDs, tunables, credentials
# All connection strings and resource names live here, not in code or SQL.

warehouse:
  # Airflow connection ID for warehouse (set up in Airflow UI)
  connection_id: warehouse_default
  # TODO: replace with real warehouse type (bigquery, snowflake, etc.)
  type: bigquery
  project_id: sample-warehouse-project
  dataset_id: sample_orders

object_storage:
  # Where to export lookup tables for import into serving DB
  bucket: ecommerce-order-lookup-sample-exports
  export_folder: ecommerce_orders/exports
  # File format for exports (parquet or csv)
  export_format: parquet

serving_db:
  # Airflow connection ID for serving database
  connection_id: serving_db_default
  # TODO: replace with real database type (postgres, mysql, etc.)
  type: postgres
  host: serving-db.example.internal
  port: 5432
  database: sample_lookups

  # Import tuning: concurrent shard imports
  import_max_concurrency: 2
  # TODO: set based on serving DB's sustainable load

  # Indexes to build on staging table (after bulk load)
  staging_indexes:
    - name: idx_order_lookup_staging_order_id
      unique: true
      columns:
        - order_id
    - name: idx_order_lookup_staging_customer_id
      unique: false
      columns:
        - customer_id

# Data quality tolerance
row_count_reconciliation_tolerance: 0.01  # 1% difference acceptable
