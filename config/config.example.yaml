# Configuration template for data-warehouse-to-api pipeline
# Copy this to config.yaml and edit for your environment

# Warehouse configuration
warehouse:
  # BigQuery, Snowflake, Redshift, etc.
  type: bigquery
  project_id: "my-project"
  dataset_id: "analytics"

# Serving database configuration
serving_db:
  type: postgres
  host: "postgres.example.com"
  port: 5432
  database: "lookups"
  # Set via environment variable in CI/CD, not here
  # username: secret
  # password: secret

# Lookup table schema
lookup_table:
  # Final output table name
  name: "customers_lookup"

  # Primary key column (used for uniqueness checks)
  primary_key: "customer_id"

  # Columns expected in the final table
  # Used by coverage check to fail if any are missing upstream
  expected_columns:
    - customer_id
    - customer_name
    - email
    - phone
    - address
    - signup_date
    - tier
    - total_spent
    - last_order_date
    - support_region

# Domain table definitions
# Each domain becomes an intermediate table, then assembled into final lookup
domains:
  # Domain 1: Core customer data (the "driving" table)
  customer_core:
    # Warehouse table to query
    source_table: "raw_customers"

    # Local name for intermediate table
    intermediate_name: "domain_customer_core"

    # Uniqueness assumption for this domain
    # Used to deduplicate if source is finer-grained
    grain: "one row per customer_id"

    # Columns to include (empty = all)
    columns:
      - customer_id
      - customer_name
      - email
      - phone
      - address
      - signup_date

    # Optional: Row-level filter
    # where_clause: "status = 'active'"

  # Domain 2: Customer tier/engagement
  customer_engagement:
    source_table: "raw_customer_engagement"
    intermediate_name: "domain_customer_engagement"
    grain: "one row per customer_id, latest by updated_at"

    columns:
      - customer_id
      - tier
      - total_spent

  # Domain 3: Recent activity
  customer_activity:
    source_table: "raw_orders"
    intermediate_name: "domain_customer_activity"
    grain: "one row per customer_id, latest order"

    columns:
      - customer_id
      - last_order_date

# Join configuration
# Specifies which domain is "driving" and how to join the rest
join:
  # Driving domain: defines the scope of entities in the lookup
  driving_domain: "customer_core"

  # Other domains to LEFT JOIN
  enrichment_domains:
    - customer_engagement
    - customer_activity

# Data quality gates
# These run between Build phase and Serve phase
# If any fail, the pipeline stops before overwriting the live table
data_quality:
  # Minimum expected row count
  # Set to 0 to skip check
  min_rows: 100

  # Check for duplicate primary keys
  # If true, fails if primary key is not unique
  unique_primary_key: true

  # Optional: Row count tolerance
  # If previous day had N rows, new day must have between
  # N * (1 - row_count_change_tolerance) and N * (1 + row_count_change_tolerance)
  # Set to null to skip
  row_count_change_tolerance: 0.15  # ±15%

# Lookback window
# How much historical data to reprocess on each run
lookback:
  # Number of days of history to include
  window_days: 90

  # Some warehouses support faster incremental loads
  # If using incremental logic, set these
  # incremental: true
  # incremental_column: "updated_at"

# Export/Import configuration
export_import:
  # Object storage for shard files (GCS, S3, etc.)
  # Only needed if exporting to object storage
  # object_storage_path: "gs://my-bucket/exports/"

  # Maximum concurrent imports
  # Set based on serving database capacity
  # Too high: starves other traffic
  # Too low: slow import
  import_max_concurrency: 4

  # Shard size (rows per file)
  # Larger shards = fewer files but bigger network transfers
  # Smaller shards = more files but parallelizes better
  shard_row_count: 100000

# Scheduling
scheduling:
  # What time to run the pipeline (UTC)
  # Format: HH:MM
  run_time: "02:00"

  # Frequency
  # "daily", "weekly", or cron expression
  frequency: "daily"

# Monitoring & Alerting
monitoring:
  # Slack webhook URL for alerts (optional)
  # slack_webhook_url: "https://hooks.slack.com/services/..."

  # Alert on failure
  alert_on_failure: true

  # Alert on slow runs
  # Set to null to disable
  alert_if_duration_exceeds_minutes: 30

# Rollback safety
rollback:
  # Keep previous live table for this many cycles
  # 1 = keep for 1 cycle, then drop on next successful run
  keep_previous_cycles: 1
